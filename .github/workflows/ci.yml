name: OrderPulse CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint-test-build:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: orderpulse
          POSTGRES_USER: appuser
          POSTGRES_PASSWORD: apppassword
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      mongo:
        image: mongo:7
        ports:
          - 27017:27017


      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Lint with Ruff
        run: ruff check app/

      - name: Run Pytest Integration Suite
        env:
          DEBUG: "False"
          SECRET_KEY: "ci-test-secret-key"
          DATABASE_URL: "postgres://appuser:apppassword@localhost:5432/orderpulse"
          MONGO_URI: "mongodb://localhost:27017/"
          REDIS_URI": "redis://localhost:6379/0"
        run: |
          cd app
          pytest -v

      - name: Verify Docker Production Build
        run: docker build -t orderpulse:ci-check .


