services:
  web:
    build: .
    ports:
      - "8000:8000"
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      mongo:
        condition: service_started
      redis:
        condition: service_started

  worker:
    build: .
    command: celery -A core worker --loglevel-info
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      mongo:
        condition: service_started
      redis:
        condition: service_started

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: orderpulse
      POSTGRES_USER: appuser
      POSTGRES_PASSWORD: apppassword
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready" -U appuser -d orderpulse"]
      interval: 5s
      timeout: 5s
      retries: 5

    mongo:
      image: mongo:7
      ports:
        - "27017:27017"
    redis:
      image: redis:7-alpine
      ports:
        - "6379:6379"



